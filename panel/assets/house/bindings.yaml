# Hand-maintained Key -> Hub bindings (ADR-0005) — the converter NEVER
# touches this file. It is the only hand-maintained half of the House
# Plan left: everything else (where a Device is, what it is called, what
# kind it is, which Room it belongs to) is drawn in Sweet Home 3D and
# regenerated by tool/sh3d_to_yaml.py.
#
# Every Placement in house.yaml MUST have an entry here, keyed by its
# placementKey.
#
# entity: the Hub entity this Device's state comes from. These point at
#   the development Hub's generated stand-ins (hub/dev/) — replace each
#   with the real entity id as the hardware is integrated. Omit the line
#   entirely while the Hub knows nothing about it; the pin still renders,
#   with unknown state.
# stream: the go2rtc stream this camera or doorbell plays in its Popup —
#   the NAME of an entry under `streams:` in hub/go2rtc/go2rtc.yaml, never
#   a URL:
#
#     cam-garage:
#       entity: sensor.garage_cam
#       stream: garage_cam       # matches hub/go2rtc/go2rtc.yaml
#       connectivity: cloud
#
#   Pasting an `rtsp://…` here does not fail — go2rtc would CREATE a stream
#   by that name and dial it, and the camera password in the URL would land
#   in the Panel's log. So the value must be one or more of letters, digits,
#   dot, dash and underscore and nothing else, which rules out the `:`, `/`
#   and `@` a URL needs; anything else is refused at boot.
#
#   The refusal deliberately does NOT print what you typed — that complaint
#   is itself logged, so echoing a mis-pasted URL back would be what
#   published the password. It names this file, the field, and the binding:
#   by its key when the key is plainly a name (opens with a letter or digit,
#   then letters, digits, spaces, dots, dashes and underscores, 40 characters
#   at most), and as `the 3rd binding`, counted from the top of this file,
#   when it is not. That second case is a paste that landed one
#   column to the left, with no indent, which makes the whole URL the key —
#   and the message used to print it while promising not to.
#
#   Two things this does NOT protect, both worth knowing before you type:
#     - A syntax error is caught by the YAML reader before any rule here
#       runs, and it reports the file, the line and the column — but not
#       the line itself. Go and read the line; that is the only place the
#       value is.
#     - A stream name that LOOKS like a name is logged every time its Popup
#       opens. Paste an API token where a name goes and it parses, and it is
#       published. `stream:` takes a name from go2rtc.yaml, nothing else.
#   Omit the line until the feed exists; the pin still renders and the
#   Popup says the view is unavailable, which is the honest answer. Legal
#   only on camera and doorbell Devices — anywhere else it is a line
#   nothing would ever read, and the Panel refuses to start rather than
#   leave you believing a feed is wired up. Two Devices MAY name the same
#   stream: nothing here writes to a camera, so they cannot fight.
# talk: the go2rtc stream the push-to-talk button pushes INTO. Held to the
#   same name-not-a-URL rule as stream:, and refused the same way, for a
#   sharper reason: this name reaches go2rtc as the `dst=` of a call that
#   pushes a live microphone into it.
#
#   It is NOT the same value as stream:, and the Front Door is the proof —
#   it plays `ring_doorbell` (ring-mqtt's RTSP restream) and talks into
#   `ring` (go2rtc's native `ring:` source). Only the second carries a
#   backchannel, which is the whole of ADR-0011. Nothing derives one from
#   the other; both are named here.
#
#   Legal only on a doorbell: a camera has no speaker at the other end.
#   Omit it until talkback exists — the button's caption then says so.
# connectivity: local | cloud — not derivable from the Hub, and there is
#   no honest default (planned cloud hardware is cloud before it binds),
#   so it is declared here and the Popup shows it (CONTEXT.md).
bindings:
  # Garage
  garage-door:
    entity: input_boolean.garage_door
    connectivity: cloud # ratgdo retrofit planned
  ev-charger:
    entity: sensor.tesla_wall_connector
    connectivity: cloud
  energy-monitor:
    entity: sensor.emporia_vue
    connectivity: cloud # ESPHome reflash planned
  cam-garage:
    entity: sensor.garage_cam
    connectivity: cloud

  # Family Room
  tv-family:
    entity: input_boolean.tv_family
    connectivity: local
  light-family:
    entity: input_boolean.light_family
    connectivity: local
  light-reading:
    entity: input_boolean.light_reading
    connectivity: local
  outlet-outdoor-a:
    # Kasa EP40 outdoor plug, socket A (phase 2, 2026-08-04). The Key says
    # "media" and the socket is on the patio — a placeholder-house mismatch
    # accepted under D5: Keys are stable identities, and re-keying once the
    # real drawing lands is a bindings.yaml-only edit by design (ADR-0005).
    # Nothing is wired to it yet; outdoor lighting is a future purchase, and
    # binding it now is what makes it usable the day it is.
    #
    # WHICH SOCKET: the one labelled "Plug 1" on the plug body — confirmed at
    # the hardware 2026-08-05 by toggling this entity and watching it respond.
    # Do NOT re-derive that from the entity name: TP-Link labels the sockets
    # from 1 and HA numbers the children from 0, so "Plug 1" is child _0. The
    # digits disagree on purpose. Full table: commissioning Ch. 4 §4.1.5.
    entity: switch.outdoor_outlet_a
    connectivity: local

  # Kitchen
  oven:
    entity: sensor.oven
    connectivity: cloud
  light-kitchen:
    entity: input_boolean.light_kitchen
    connectivity: local
  feeder-granary:
    entity: sensor.granary_feeder
    connectivity: cloud
  feeder-petlibro:
    entity: sensor.petlibro_one
    connectivity: cloud

  # Living Room
  tv-living:
    entity: input_boolean.tv_living
    connectivity: local
  light-living:
    # THE ENTRY LIGHT — Kasa HS103, 192.168.68.59, MAC 5C:A6:E6:09:B6:19.
    # REPURPOSED 2026-08-05: this plug ran a refrigerator until that day, and
    # Ch. 4 §4.1.1 still carries the safety analysis that made it unbindable.
    # A `light` Key toggles on a single tap with no confirmation anywhere in
    # the Panel (ADR-0006), so while a fridge was on it, a wall screen at child
    # height was one mis-tap from silently killing it. The hazard is not
    # mitigated, it is GONE — the load changed. Nothing in the Panel or the Hub
    # can tell a fridge from a lamp, so if this plug is ever moved back onto
    # something that must not lose power, THIS BINDING COMES OUT FIRST, before
    # the plug is moved.
    #
    # Why `light-living` and not `light-hall`, which is what the entry
    # actually is: `light-hall` is the test suite's canonical togglable-Device
    # fixture and ha_hub_live_test toggles it against the dev Hub. Binding it
    # to real hardware turns 8 tests red. `light-living` has no test
    # references. Both names are placeholder-house fictions anyway (D5, same
    # as outlet-outdoor-a) and get re-keyed when the real drawing lands —
    # a bindings.yaml-only edit by design (ADR-0005).
    entity: switch.entry_light
    connectivity: local
  cam-living:
    entity: sensor.living_cam
    connectivity: cloud

  # Office
  light-office:
    entity: input_boolean.light_office
    connectivity: local
  outlet-outdoor-b:
    # Kasa EP40 outdoor plug, socket B — same D5 caveat as outlet-outdoor-a.
    # Bind the CHILDREN, never switch.tp_link_smart_plug_722c: the parent
    # drives both sockets, so one pin would silently toggle the other's load.
    #
    # WHICH SOCKET: the one that is not "Plug 1" — i.e. child _1, presumably
    # labelled "Plug 2". Established by elimination on 2026-08-05, not by
    # toggling this entity at the plug; A is the one that was watched. Sound
    # for a two-socket unit, but weaker evidence than A's, so if a pin ever
    # seems to drive the wrong load, re-check THIS one first.
    entity: switch.outdoor_outlet_b
    connectivity: local
  cam-office:
    entity: sensor.office_cam
    connectivity: cloud

  # Hall (front door south side)
  doorbell:
    # Ring doorbell via ring-mqtt 5.9.3, authenticated 2026-08-05. Cloud
    # permanently — Ring has no local API at all (Ch. 5 §3.1), so this is not
    # a gap waiting to be closed.
    #
    # THE TIMESTAMP SHAPE, since 2026-08-05 (phase 7 §A). ring-mqtt itself
    # publishes NO `event.*` entity in any version, so this entity is OURS:
    # an HA MQTT-event entity minted over ring-mqtt's ding topic
    # (hub/ha-config/mqtt.yaml, gitignored; tracked example beside it). Its
    # state is the press timestamp, restored across HA restarts WITHOUT
    # re-firing, and it fires on every ON publish — so classifyDing() takes
    # rule 2 (press-time identity + 60 s freshness), and the two losses the
    # old binary_sensor word shape carried are gone: the first press after a
    # restart rang nothing (first_sight), and a second press inside the ding
    # window was `on -> on`, invisible by construction.
    #
    # WHAT THE NEW SHAPE STILL COSTS, so nobody rediscovers it the hard way
    # (phase-7 §A2, "two holes"): an HA restart DURING an active ding window
    # meets ring-mqtt's birth-republish and can re-ring (bounded; ding
    # duration lowered 180 -> 60 s to shrink the collision 3x), and a PANEL
    # restart within 60 s of an answered press re-rings once (_rungFor is
    # in-memory). Both bounded, both accepted, both documented there.
    #
    # The lastDingTime template-sensor escape hatch that used to be argued
    # here is superseded — the event entity strictly dominates it
    # (Ch. 5 §1.3 records the burial).
    entity: event.front_door_ding
    stream: ring_doorbell
    # Two-way audio (ADR-0011). A DIFFERENT go2rtc stream from `stream:`
    # above, not a variant spelling of it: `ring_doorbell` is ring-mqtt's
    # RTSP restream, which has no backchannel and never could carry talk;
    # `ring` is go2rtc's own native `ring:` source, which does. Pushing to
    # this name is what opens the microphone at the door.
    talk: ring
    # The tile's still face in the Cameras view (phase 7 §B4): the ding
    # entity above is the doorbell's STATE and this is its PICTURE — two
    # different HA entities, underivable from each other, so the binding
    # names both. Fetching it costs no Ring session: HA already holds the
    # JPEG (snapshot mode Auto), which is the whole reason the tile's
    # default-off state can show the front door without deafening the bell.
    snapshot: camera.front_door_snapshot
    connectivity: cloud
  thermostat:
    # ecobee Smart Thermostat Premium "Main Floor", paired LOCALLY over
    # HomeKit 2026-08-04 (homekit_controller). This id comes from the
    # homekit_controller entry, NOT the ecobee cloud one — the same HAP
    # advert raises two discovery cards and the branded one is the cloud
    # integration, which would make `connectivity: local` a lie. See
    # appliance/commissioning/04-devices-local.md.
    entity: climate.main_floor
    connectivity: local
  light-hall:
    # DELIBERATELY still a dev stand-in. The entry light was bound here first
    # and reverted the same hour: `light-hall` is the test suite's canonical
    # togglable-Device fixture (ha_hub_test, hub_contract_test — which runs
    # against BOTH adapters — dollhouse_test, fake_hub_test), and
    # ha_hub_live_test *toggles* it against the dev Hub, which real hardware
    # can never satisfy. Pointing this Key at a real entity turns 8 tests red.
    # The entry light lives on `light-living` instead; see there.
    entity: input_boolean.light_hall
    connectivity: local

  # Guest Bathroom / Laundry
  light-guest-bath:
    entity: input_boolean.light_guest_bath
    connectivity: local
  washer:
    entity: sensor.lg_washer
    connectivity: cloud
  dryer:
    entity: sensor.lg_dryer
    connectivity: cloud

  # Upstairs
  light-master:
    entity: input_boolean.light_master
    connectivity: local
  tv-master:
    entity: input_boolean.tv_master
    connectivity: local
  outlet-master:
    entity: input_boolean.outlet_master
    connectivity: local
  light-master-bath:
    entity: input_boolean.light_master_bath
    connectivity: local
  light-bed2:
    entity: input_boolean.light_bed2
    connectivity: local
  light-bed3:
    entity: input_boolean.light_bed3
    connectivity: local
  light-kids-bath:
    entity: input_boolean.light_kids_bath
    connectivity: local
  light-landing:
    # THE STAIRS LIGHT — Kasa HS103, 192.168.68.60, MAC 5C:A6:E6:09:B5:F8.
    # REPURPOSED 2026-08-05 from the aquarium; same §4.1.1 note as the entry
    # light on `light-living`, and the same standing rule: a pump and heater
    # were on this socket, so if it ever goes back onto a load that must not
    # lose power, this binding comes out before the plug moves.
    #
    # `light-stairs` was asked for and does NOT exist — house.yaml is
    # generated from the drawing and says DO NOT EDIT BY HAND (ADR-0004/0005),
    # so a new Key is a Sweet Home 3D session, not a YAML line. `light-landing`
    # is the top of the stairs and has no test references. Re-key at F1.
    entity: switch.stairs_light
    connectivity: local
  litter-robot:
    entity: sensor.litter_robot_5
    connectivity: cloud
