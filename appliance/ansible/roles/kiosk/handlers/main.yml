---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A unit-file change must reach the RUNNING compositor, not just systemd's
# memory — daemon-reload alone leaves the old cage config live until reboot.
# try-restart (not restart): a live kiosk picks the change up immediately,
# but a not-yet-started unit stays down — first start belongs to the reboot
# in the enable flow (and on the laptop gdm may still hold the seat).
- name: Restart cage
  ansible.builtin.command: systemctl try-restart cage@{{ kiosk_tty }}.service
  when: kiosk_enable | bool
  changed_when: true

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true
