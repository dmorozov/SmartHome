# AMD laptop — dev Appliance (Radeon iGPU + NVIDIA dGPU, Ubuntu Desktop 24.04).

# MANDATORY before enabling the kiosk here (runbook Step 0a): pin cage to the
# amdgpu iGPU so the NVIDIA card stays out of the compositor's path. Find the
# right card with appliance/scripts/check-hybrid-gpu.sh, then set e.g.:
# wlr_drm_devices: /dev/dri/card1

# DAILY-DRIVER GUARANTEE: a plain converge leaves this a normal GNOME laptop.
# All kiosk gates default false — cage is installed but never enabled, gdm is
# never touched. The laptop becomes a kiosk ONLY with the explicit spike-day
# flags below, and reverts with:
#   sudo systemctl disable cage@tty1.service && sudo systemctl enable gdm3
# kiosk_enable: true
# kiosk_disable_gdm: true
#
# Not yet automated here: Docker Engine + the hub stack (hub/compose.yaml) —
# manual for now (sudo apt install docker.io; cd hub && docker compose up -d);
# becomes a 'hub' role in site.yml later.
