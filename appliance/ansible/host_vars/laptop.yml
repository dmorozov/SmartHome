# Lenovo Legion 9 16IRX8 — dev Appliance and current Hub host (ADR-0008).
#
# HARDWARE, verified on the box 2026-08-03 (the repo previously described this
# machine as an AMD laptop with a Radeon iGPU — it is not):
#   CPU   Intel Core i9-13980HX (Raptor Lake-HX)
#   iGPU  Intel Raptor Lake-S UHD Graphics, i915, PCI 00:02.0  -> card2
#   dGPU  NVIDIA RTX 4090 Laptop, nvidia,     PCI 01:00.0      -> card1
#   NIC   Realtek Killer E3000 2.5GbE (enp162s0) + Intel AX210 Wi-Fi (wlp164s0)
#   OS    Ubuntu 26.04 LTS (resolute), kernel 7.0.0-28-generic, systemd 259 —
#         upgraded from 25.10 on 2026-08-03 (phase 0 step 1 / open item 1: done)

# Hybrid-GPU pin (runbook Step 0a) — MANDATORY before enabling the kiosk here:
# cage/wlroots must never open the NVIDIA card. Pinned by stable PCI path
# rather than /dev/dri/cardN, because card numbering is not guaranteed stable
# across boots (observed: card1=nvidia, card2=i915 — the reverse of the
# enumeration the old amdgpu-oriented notes assumed).
wlr_drm_devices: /dev/dri/by-path/pci-0000:00:02.0-card

# STILL UNVERIFIED for spike day: which card actually owns the physical HDMI
# port. With no display attached every connector reads `disconnected`, so the
# owner cannot be read out of sysfs — and both cards advertise HDMI-A-*
# connectors (2026-08-03 boot: card1/nvidia HDMI-A-1, card2/i915 HDMI-A-2..5;
# those names move with the card numbering). Plug the touchscreen in and re-run
# appliance/scripts/check-hybrid-gpu.sh, which now recognises i915 and says so
# when nothing is connected. The pin above is correct either way: cage opens
# the i915 card and nothing else.

# DAILY-DRIVER GUARANTEE: a plain converge leaves this a normal GNOME laptop.
# All kiosk gates default false — cage is installed but never enabled, gdm is
# never touched. The laptop becomes a kiosk ONLY with the explicit spike-day
# flags below, and reverts with:
#   sudo systemctl disable cage@tty1.service && sudo systemctl enable gdm3
# kiosk_enable: true
# kiosk_disable_gdm: true
#
# Not yet automated here: Docker Engine + the hub stack (hub/compose.yaml) —
# manual for now (phase 0 step 5 done by hand: docker-ce 29.7.1 +
# compose v5.4.0, login user in the docker group); becomes a 'hub' role later.
#
# kiosk_hwe_kernel: the group default (true) applies, with NO per-host override.
# On 26.04 kiosk_hwe_kernel_packages resolves to `linux-generic-hwe-26.04`,
# already installed at 7.0.0-28.28: `apt-get install -s` reports 0 upgraded,
# 0 newly installed. The role's apt-mark step is the part that does work here —
# after the release upgrade this host had linux-generic-hwe-26.04 marked *auto*,
# held only by the transitional `linux-generic-hwe-24.04` (a shim Ubuntu
# documents as safe to remove). The first fixed converge claims it as manual;
# only after that is it safe to purge the shim.

# WALL GRADING (commissioning 6 §6.10) — 2026-09-04, this host.
#
# CAVEAT ON THIS RECORD: graded under XWayland on GNOME, not under cage. This
# box is the dev appliance and its kiosk half is still untouched, so the
# compositor the wall will actually run under has NOT been graded — and the
# embedder's frame-available path is exactly what differs between the two.
#
# Graded with panel/tool/freeze_probe.sh rather than by eye, which is possible
# here and is not on a box with no desktop environment. Eight arms, four per
# decoder. No picture was blocky in any arm. Two arms graded 4/6 and both were
# hub-side rather than rendering faults: in one, a camera never left
# "Connecting..."; in the other, a tile held a stalled picture whose burned-in
# clock was 18 s behind its neighbours. That distinction is the whole point of
# §6.10's third question — a lagging clock is a stalled Hub stream, a matching
# clock over still pixels would be a severed texture.
#
# Result: both graded settings keep their shipped defaults. Recorded because a
# negative nobody wrote down gets re-litigated, not because anything changed.
#   VIDEO_REPAINT_PULSE  off     — the Panel's default since 2026-09-04; the
#                                  pulse bought nothing measurable here
#   VIDEO_DECODERS       FFmpeg  — `auto` measured ~15% cheaper with a clean
#                                  picture and was KEPT at software by owner
#                                  decision (ADR-0014)
#
# No panel_video_* override is set on this host, and none should be added to
# record a negative — an empty var is what "the Panel's own default" means, and
# a var set to a placeholder word would be delivered verbatim as an
# Environment= line. `VIDEO_TRANSPORT=unset` in particular does not mean unset:
# it fails the Panel's allowlist, warns, and falls through to MJPEG.
