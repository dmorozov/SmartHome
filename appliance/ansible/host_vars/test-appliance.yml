# Disposable Docker test appliance (appliance/test/run.sh up).
ansible_host: localhost
ansible_port: 2222
ansible_user: ubuntu
# inventory_dir (not playbook_dir): defined identically for ansible-playbook
# AND ad-hoc `ansible` runs; playbook_dir silently falls back to cwd ad-hoc.
ansible_ssh_private_key_file: "{{ inventory_dir }}/../test/.keys/id_ed25519"
# The container is recreated at will — never pin its host key.
ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# A kernel package is meaningless inside a container.
kiosk_hwe_kernel: false
