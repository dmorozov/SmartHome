# Appliance inventory. Real hosts carry PLACEHOLDER addresses until they
# exist on the LAN — set ansible_host (and any SSH particulars) when known.
all:
  children:
    appliances:
      hosts:
        laptop:
          # Lenovo Legion 9 16IRX8 (Intel i9-13980HX, Intel UHD iGPU + NVIDIA
          # RTX 4090 dGPU), Ubuntu 25.10 -> 26.04 LTS. Current Hub host.
          #
          # REAL address as of phase 0 (2026-08-03). This is a Wi-Fi lease
          # (wlp164s0, AX210) and it is deliberately NOT DHCP-reserved — see
          # the phase-0 as-built notes for why that was judged acceptable and
          # what it costs. It CAN drift; if the Hub stops answering, re-check
          # here first. Wired enp162s0 (Killer E3000) is cabled-down.
          ansible_host: 192.168.68.81
        minipc:
          # Ryzen AI mini PC (production Appliance), Ubuntu Server 24.04.
          # PLACEHOLDER — machine not purchased yet:
          ansible_host: minipc.placeholder.invalid
    test:
      hosts:
        # Disposable Docker test appliance (appliance/test/run.sh up).
        # Connection details live in host_vars/test-appliance.yml.
        test-appliance:
