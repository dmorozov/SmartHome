# Mosquitto broker for the Hub stack.
# Serves Zigbee2MQTT, Home Assistant's MQTT integration, and any future MQTT
# devices (ratgdo, ESPHome nodes) or direct Panel subscriptions.

# Listen on 1883 on all container interfaces; docker compose publishes it to
# the LAN. Plain MQTT, no TLS — LAN-only, never internet-exposed (remote
# access is VPN-only per the architecture).
listener 1883 0.0.0.0

# ============================================================================
# !!! DEV ONLY — DO NOT GO TO PRODUCTION WITH THIS !!!
# Anonymous access is enabled for laptop development convenience.
# BEFORE the stack moves to the mini PC, switch to authenticated access:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd     (create with mosquitto_passwd;
#                                               keep passwd OUT of git)
# and set matching credentials in z2m-data/configuration.yaml and HA's MQTT
# integration.
# ============================================================================
allow_anonymous true

# Retained messages and subscriptions survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
