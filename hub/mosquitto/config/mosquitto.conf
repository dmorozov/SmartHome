# Mosquitto broker for the Hub stack.
# Serves ring-mqtt, Home Assistant's MQTT integration, Zigbee2MQTT (once the
# coordinator exists), and any future MQTT devices (ratgdo, ESPHome nodes) or
# direct Panel subscriptions.

# Listen on 1883 on all container interfaces; docker compose publishes it to
# the LAN. Plain MQTT, no TLS — LAN-only, never internet-exposed (remote
# access is VPN-only per the architecture).
listener 1883 0.0.0.0

# Authenticated access from day one (grilling decision D4, 2026-08-03): the
# broker is LAN-exposed via the published port, so anonymous was never
# acceptable on the laptop either. The passwd file is gitignored.
#
# Bootstrap on a fresh host — the file must EXIST before the broker starts
# (mosquitto refuses to run with a missing password_file). Per ADR-0010, the
# live file lives outside the repo at ~/.sh_keys/mosquitto/passwd and is
# bind-mounted onto this same in-container path — so every command below is
# unchanged from before ADR-0010 except where the file is touched/chowned
# directly on the host:
#   mkdir -p ~/.sh_keys/mosquitto && touch ~/.sh_keys/mosquitto/passwd
#   sudo chown 1883:1883 ~/.sh_keys/mosquitto/passwd && sudo chmod 600 ~/.sh_keys/mosquitto/passwd
#   docker compose up -d mosquitto
#   docker exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd ha   '<ha-password>'
#   docker exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd ring '<ring-password>'
#   docker exec mosquitto mosquitto_passwd -b /mosquitto/config/passwd z2m  '<z2m-password>'
#   # REDO the chown: mosquitto_passwd rewrites the file with mkstemp+rename and
#   # does not preserve ownership, and `docker exec` runs as root — so the file
#   # is root:root 0600 by here, and the broker (uid 1883) would fail the next
#   # start with `Error: Unable to open pwfile`.
#   sudo chown 1883:1883 ~/.sh_keys/mosquitto/passwd && sudo chmod 600 ~/.sh_keys/mosquitto/passwd
#   sudo rm -f ~/.sh_keys/mosquitto/passwd.backup.*   # hashed backups mosquitto_passwd leaves
#   docker compose restart mosquitto
# Matching credentials go in: HA's MQTT integration (user `ha`),
# ~/.sh_keys/ring-mqtt/config.json (user `ring`), and z2m-data/configuration.yaml
# (user `z2m`, when Zigbee arrives).
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages and subscriptions survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
