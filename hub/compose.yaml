# Hub stack — Home Assistant + Mosquitto + ring-mqtt + go2rtc (+ Zigbee2MQTT,
# parked behind the `zigbee` profile until the SLZB-06 coordinator exists).
#
# Runs on the dev laptop today (ADR-0008) and migrates UNCHANGED to the Ryzen
# AI mini PC (copy this directory AND ~/.sh_keys — see ADR-0010, secrets no
# longer live under this directory — then `docker compose up -d`).
#
# Start order: mosquitto -> ring-mqtt/zigbee2mqtt (depends_on) -> homeassistant.
#   `docker compose up -d` handles it; Home Assistant tolerates the broker
#   appearing after it (the MQTT integration reconnects).
#
# RUNNING `up`/`--force-recreate` FROM INSIDE THE DEVCONTAINER (ADR-0010):
#   relative paths here (./ha-config, ./mosquitto/config, …) resolve against
#   the INVOKING SHELL's view of the filesystem, not the host's. This repo's
#   devcontainer has its own /workspaces/SmartHome that is NOT the same
#   directory as the real host's checkout — recreating a service from inside
#   it silently re-points that service's mounts at an empty, unrelated path
#   (measured 2026-08-07; mosquitto and go2rtc both "started" with no
#   credentials). `docker compose restart <service>` is unaffected (reuses
#   the running container's already-resolved mounts) — only recreation is at
#   risk. From inside the devcontainer, recreate with:
#     docker compose --project-directory /home/dmorozov/Work/SmartHome/hub \
#       --env-file /workspaces/SmartHome/hub/.env -f compose.yaml up -d …
#   or just run it from the host's own terminal, which has no ambiguity.
#
# Bring-up: docs/plans/device-integrations/phase-1-hub-stack.md is the
# current step-by-step; README.md in this directory has the standing notes.
# TL;DR:
#   1. Mosquitto auth bootstrap (auth is REQUIRED — the broker is
#      LAN-exposed): create ~/.sh_keys/mosquitto/passwd, then add users after
#      start — see mosquitto/config/mosquitto.conf.
#   2. cp ring-mqtt-data/config.example.json ~/.sh_keys/ring-mqtt/config.json
#      and put the `ring` MQTT password into the copy (~/.sh_keys — the
#      directory also accumulates the Ring refresh token; ADR-0010).
#   3. mkdir -p ~/.sh_keys/go2rtc && cp go2rtc/go2rtc.example.yaml
#      ~/.sh_keys/go2rtc/go2rtc.yaml (~/.sh_keys — stream URLs embed camera
#      credentials; ADR-0010).
#   3b. cp ha-config/mqtt.example.yaml ha-config/mqtt.yaml and fill the Ring
#      ids per its comments (live file gitignored; configuration.yaml
#      includes it, so HA will not start without the copy).
#   4. docker compose up -d   (zigbee2mqtt stays parked; when the SLZB-06
#      arrives: configure z2m-data/, then docker compose --profile zigbee up -d)
#   5. HA onboarding at http://<appliance>:8123; MQTT integration -> broker
#      127.0.0.1:1883, user `ha`.
#
# Secrets — ADR-0010: everything this stack itself owns the path for lives
# outside the repo entirely, under ~/.sh_keys on the host, bind-mounted back
# onto the SAME in-container paths they always used (so nothing inside a
# container, and no `docker exec` command anywhere in the docs, changed).
# `rm -rf ~/.sh_keys` is the whole "forget every credential" mechanism.
#   - The Panel's long-lived HA token: ~/.sh_keys/token (was ./token).
#   - Mosquitto's hashed passwd file: ~/.sh_keys/mosquitto/passwd (was
#     mosquitto/config/passwd) — mosquitto.conf's password_file path is
#     unchanged; only this one file's bind-mount source moved.
#   - ring-mqtt's config.json + the Ring REFRESH TOKEN it accumulates in
#     ring-state.json: ~/.sh_keys/ring-mqtt/ (was ./ring-mqtt-data).
#   - go2rtc's live stream config (may embed camera credentials):
#     ~/.sh_keys/go2rtc/go2rtc.yaml (was ./go2rtc/go2rtc.yaml, mounted as a
#     directory — see the go2rtc service below for why) — go2rtc.example.yaml
#     stays tracked at ./go2rtc/ as the starter template.
#   - EXCEPTION, deliberate: HA's own runtime state (./ha-config/.storage —
#     every cloud integration's OAuth tokens, the auth store) stays exactly
#     where it is. HA owns that format/location internally; there's no path
#     to "point it" elsewhere without relocating all of HA's config, not
#     just its secrets. See ADR-0010.
#   - Zigbee2MQTT writes the generated Zigbee network key into ./z2m-data
#     after first start (not yet created — no coordinator on the LAN yet).
#     Revisit whether it joins ~/.sh_keys when that lands.

services:
  homeassistant:
    # Pinned exactly. Per the repo README: the Hub is a black-box appliance —
    # versions are pinned and updated deliberately on OUR schedule, after
    # reading the release notes, never by a floating tag. (HA ships monthly
    # with documented breaking changes; see the calendar items in hub/README.md
    # before moving past 2026.7.)
    image: ghcr.io/home-assistant/home-assistant:2026.7
    container_name: homeassistant
    # host networking is REQUIRED, not an optimization: HomeKit-controller
    # pairing for the Ecobee and Samsung TV discovery both need mDNS/multicast,
    # which Docker bridge networking breaks. (This is also why the hub stack
    # lives on the Linux laptop, not Docker-on-macOS.)
    network_mode: host
    volumes:
      - ./ha-config:/config
      # Our own extensions/fixes slot: custom integrations dropped here are
      # picked up by HA without a custom image. See custom_components/README.md.
      - ./custom_components:/config/custom_components
    restart: unless-stopped

  mosquitto:
    # Pinned exactly 2026-08-03, replacing a floating `:2`. Measured, not
    # assumed: `:2` had already moved to the 2.1 line, and 2.1 DEPRECATES
    # `password_file` and `allow_anonymous` (removal in 3.0) — the two
    # directives mosquitto/config/mosquitto.conf and phase 1 §1c stand on. A
    # floating major meant that config could go stale under a `compose pull`,
    # on a broker whose 1883 is published to the LAN.
    #
    # The tag looks odd on purpose: there is NO unsuffixed `2.1.2` on Docker
    # Hub — upstream publishes the 2.1 line only as `-alpine`. This tag is the
    # exact image `:2` already resolved to (amd64 digest sha256:6dba0f1b2795…,
    # identical to `2.1-alpine`; `2.0.22` is a different image).
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      # ADR-0010: the hashed passwd file itself lives outside the repo,
      # overlaid onto the same in-container path mosquitto.conf names.
      - ${SH_KEYS_DIR}/mosquitto/passwd:/mosquitto/config/passwd
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  zigbee2mqtt:
    # PIN THE EXACT TAG AT FIRST DEPLOY: replace `2` with the exact version you
    # brought up (e.g. koenkk/zigbee2mqtt:2.x.y) and commit it. Zigbee2MQTT's
    # exact current 2026 version was not researched when this scaffold was
    # written; the major is pinned so a config-format-breaking 3.x can never
    # arrive silently.
    image: koenkk/zigbee2mqtt:2
    container_name: zigbee2mqtt
    # PARKED until the SLZB-06 coordinator is purchased and on the LAN —
    # without it the service just crash-loops. Plain `up -d` skips it; start
    # with `docker compose --profile zigbee up -d` once z2m-data/ is
    # configured (docs/plans/device-integrations/phase-1-hub-stack.md §1b).
    profiles: ["zigbee"]
    depends_on:
      - mosquitto
    # host networking so the config's `mqtt://localhost:1883` reaches the
    # broker's host-published port, and the frontend is on <appliance>:8080
    # with no extra mapping.
    network_mode: host
    volumes:
      - ./z2m-data:/app/data
    # NO usb device mapping on purpose: the coordinator is an SMLIGHT SLZB-06
    # reached over TCP (Ethernet), not a USB stick. The radio stays central in
    # the house and survives the laptop -> mini PC migration untouched.
    restart: unless-stopped

  ring-mqtt:
    # Pinned exactly (latest at first bring-up, 2026-08-03) — same
    # deliberate-updates-only policy as the HA image. Standalone container,
    # NOT a Home Assistant "Add-on" (add-ons require HA OS/Supervised; on HA
    # Container this same project runs standalone and reaches HA via MQTT
    # discovery).
    image: tsightler/ring-mqtt:5.9.3
    container_name: ring-mqtt
    depends_on:
      - mosquitto
    # Default bridge network ON PURPOSE, unlike most of this stack: ring-mqtt
    # only needs the broker (service-name DNS: mqtt://mosquitto:1883) and the
    # Ring cloud, and its internal RTSP server binds 8554 — host networking
    # would collide with go2rtc's 8554.
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Web UI: the Ring login/2FA -> refresh-token flow, and each camera's
      # RTSP path.
      - "55123:55123"
      # Internal RTSP server, remapped: 8554 belongs to go2rtc. go2rtc pulls
      # Ring live streams from rtsp://127.0.0.1:8556/<device-id>_live.
      - "8556:8554"
    volumes:
      # ADR-0010: config.json + runtime state (incl. the Ring REFRESH TOKEN)
      # live at ~/.sh_keys/ring-mqtt/, not in the repo tree. The tracked
      # starter is ./ring-mqtt-data/config.example.json (copy it there first).
      - ${SH_KEYS_DIR}/ring-mqtt:/data
    restart: unless-stopped

  go2rtc:
    # 1.9.10 per docs/research/frigate-amd-acceleration.md (the version Frigate
    # 0.17 embeds) — keeps the phase-1 restream layer aligned with the future
    # Frigate deployment so cameras slot in without rework.
    image: alexxit/go2rtc:1.9.10
    container_name: go2rtc
    # host networking for WebRTC (dynamic UDP ports + correct candidate IPs).
    # API/UI :1984, RTSP :8554, WebRTC :8555.
    network_mode: host
    volumes:
      # ADR-0010: the live stream config (may embed camera credentials) lives
      # at ~/.sh_keys/go2rtc/go2rtc.yaml, not in the repo tree — mounted as a
      # directory, not a single file: bind-mounting a lone file onto a
      # container path with no pre-existing parent directory in the image
      # fails at container-create time (measured, alexxit/go2rtc:1.9.10 ships
      # no /config). The tracked starter is ./go2rtc/go2rtc.example.yaml — not
      # mounted; go2rtc doesn't need it.
      - ${SH_KEYS_DIR}/go2rtc:/config
    restart: unless-stopped
