# go2rtc starter configuration for the DEVELOPMENT Hub — EXAMPLE FILE.
#
# Bring-up: copy this to go2rtc.yaml (which is gitignored) before first start:
#   cp go2rtc.example.yaml go2rtc.yaml
#
# WHY the live file is gitignored: stream source URLs embed camera
# credentials (RTSP user:pass, Ring stream paths). Same rule as the
# appliance stack's ../../go2rtc/.
#
# Web UI: http://localhost:11984 — every stream gets an MSE/WebRTC preview
# there, the fastest way to check a source works before touching the Panel.
# (Host ports are the SHIFTED dev set — compose.yaml's header says why the
# canonical ones belong to the production stack on this same machine.)

# Same E8 decision as production (../../go2rtc/go2rtc.example.yaml, root
# README E8): go2rtc 403s any cross-origin WebSocket upgrade unless
# api.origin says otherwise, and 1.9.10 has no allowlist — it is "*" or no
# video in a browser. Without this, the web Panel at localhost:8080 can
# never open MSE against this instance, however correct its streams are.
# LAN exposure is not widened here: the dev ports bind 127.0.0.1.
api:
  origin: "*"

streams:
  # The one stream this file DECLARES rather than comments out, and the reason
  # is that `../README.md` already tells you to point at it: "`selftest` is the
  # stream to point at while there is no camera." Until 2026-08-07 this file
  # shipped `streams:` followed by nothing but commented placeholders, so a
  # fresh devcontainer had no stream at all and that instruction dialled a name
  # go2rtc did not have.
  #
  # It matters more than convenience. `panel/test/live_video_keepalive_live_test.dart`
  # defaults to this name precisely so that video work does not have to touch
  # the doorbell — HA core #177014 says an open Ring session can suppress the
  # *next* real ding, so pointing a test loop at `ring_doorbell` is not a
  # neutral choice. With no `selftest` here, the only runnable target was the
  # real camera.
  #
  # **Two producers, not one**, copied from the production example for the
  # reason it states at length: the web build plays H.264 over a WebSocket and
  # a native `-d linux` build pulls multipart JPEG off the same stream name. A
  # single-producer stream serves one of them and hands the other a 200 with
  # zero bytes — the documented silent failure. Keeping both here means the
  # sandbox exercises the same shape a real camera will.
  selftest:
    - ffmpeg:virtual?video&size=640x480#video=h264
    - ffmpeg:selftest#video=mjpeg

  # Wyze v3 / Pan v3 after the official RTSP firmware flash
  # (docs/research/hub-and-device-integrations.md §3.2):
  # wyze_porch: rtsp://user:pass@CAMERA-LAN-IP/live

  # Ring doorbell: ring-mqtt runs its own RTSP server INSIDE the compose
  # network. The exact path (device id) is shown in the ring-mqtt web UI at
  # http://localhost:65123 and in `docker logs ring-mqtt-dev`:
  # ring_doorbell: rtsp://ring-mqtt:8554/RING-CAMERA-ID_live

webrtc:
  candidates:
    # The compose file publishes container 8555 as HOST 28555 on 127.0.0.1 —
    # this candidate is what makes WebRTC work for a browser on this machine
    # (go2rtc would otherwise advertise its unreachable container IP), and it
    # must name the HOST port the browser can dial. To view from another
    # device, open the port binding in compose.yaml and add "LAN-IP:28555".
    - 127.0.0.1:28555
