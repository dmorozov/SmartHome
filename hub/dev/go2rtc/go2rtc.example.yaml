# go2rtc starter configuration for the DEVELOPMENT Hub — EXAMPLE FILE.
#
# Bring-up: copy this to go2rtc.yaml (which is gitignored) before first start:
#   cp go2rtc.example.yaml go2rtc.yaml
#
# WHY the live file is gitignored: stream source URLs embed camera
# credentials (RTSP user:pass, Ring stream paths). Same rule as the
# appliance stack's ../../go2rtc/.
#
# Web UI: http://localhost:11984 — every stream gets an MSE/WebRTC preview
# there, the fastest way to check a source works before touching the Panel.
# (Host ports are the SHIFTED dev set — compose.yaml's header says why the
# canonical ones belong to the production stack on this same machine.)

# Same E8 decision as production (../../go2rtc/go2rtc.example.yaml, root
# README E8): go2rtc 403s any cross-origin WebSocket upgrade unless
# api.origin says otherwise, and 1.9.10 has no allowlist — it is "*" or no
# video in a browser. Without this, the web Panel at localhost:8080 can
# never open MSE against this instance, however correct its streams are.
# LAN exposure is not widened here: the dev ports bind 127.0.0.1.
api:
  origin: "*"

streams:
  # Synthetic, two-producer — see go2rtc.example.yaml for why both. Point
  # video work here rather than at ring_doorbell: an open Ring session can
  # suppress the next real ding (HA core #177014).
  selftest:
    - ffmpeg:virtual?video&size=640x480#video=h264
    - ffmpeg:selftest#video=mjpeg

  # Wyze v3 / Pan v3 after the official RTSP firmware flash
  # (docs/research/hub-and-device-integrations.md §3.2):
  # wyze_porch: rtsp://user:pass@CAMERA-LAN-IP/live

  # Ring doorbell, VIDEO ONLY: ring-mqtt runs its own RTSP server INSIDE the
  # compose network. On-demand: the Ring cloud pull starts when a consumer
  # connects and stops when the last one leaves (the Popup's teardown is built
  # for exactly this). This is the REAL front door via the dev ring-mqtt's
  # session — owner's decision 2026-08-06.
  #
  # It CANNOT carry talkback. A generic RTSP restream has no backchannel, which
  # is why `ring:` below exists alongside it rather than replacing it. The Panel
  # binds to THIS one (panel/assets/house/bindings.yaml, `stream: ring_doorbell`).
  ring_doorbell: rtsp://ring-mqtt:8554/90486cf35236_live

  # ---------------------------------------------------------------------------
  # Ring doorbell, TWO-WAY: go2rtc's native `ring:` source (ADR-0011). This is
  # the only stream in this repo that can carry audio TO the doorbell:
  #   TALK  POST /api/streams?dst=ring&src=rtsp%3A%2F%2F127.0.0.1%3A8554%2Fmic
  #   STOP  POST /api/streams?dst=ring&src=        (empty src; idempotent)
  #
  # 🔴 PASTE THE REFRESH TOKEN BELOW, IN AN EDITOR — never into a chat window,
  # never via a shell command that lands in history. Replace the whole
  # PASTE_REFRESH_TOKEN_HERE placeholder, keeping the line on one line. Mint it
  # with (TODO.md B9):
  #   docker exec -it ring-mqtt-dev node \
  #     /app/ring-mqtt/node_modules/@tsightler/ring-client-api/lib/ring-auth-cli.js
  #
  # 🔴 It must be ITS OWN token, not ring-mqtt-dev's. Ring rotates refresh
  # tokens on use, so two consumers sharing one invalidate each other.
  #
  # 🔴 go2rtc REWRITES THIS FILE. When Ring rotates the token it patches this
  # line in place (observed 23 s after startup, preserving unrelated edits made
  # seconds earlier). Treat the value on disk as machine-owned: it is not the
  # one you pasted, restarting the container is not side-effect-free on the
  # credential, and anything that reads it must read it at point of use.
  #
  # ⚠️ Two Ring sessions will now exist on this machine — ring-mqtt-dev's and
  # this one. That was never load-tested; if dings start going missing or dials
  # start failing, suspect this first (HA core #177014, #167406).
  #
  # This file is gitignored (hub/dev/.gitignore: `go2rtc/*`), so the token is
  # not committed — but it IS on disk in the repo tree, unlike the production
  # stack which keeps its go2rtc config under ~/.sh_keys (ADR-0010). Tighten
  # the mode after pasting:  chmod 600 hub/dev/go2rtc/go2rtc.yaml
  ring: ring:?device_id=90486cf35236&camera_id=319156885&refresh_token=INSERT_TOKEN_HERE

  # The microphone this machine talks THROUGH — the `src` of the TALK call
  # above. Commented out on purpose: it captures via PipeWire's PulseAudio
  # socket, and this container has neither the socket mounted nor PULSE_SERVER
  # set (verified: `docker inspect go2rtc-dev` shows one bind, ./go2rtc only).
  # Uncommenting it without those would give a stream that fails only when
  # somebody presses talk, which is the worst moment to find out. See
  # docs/plans/ring-audio-stack.md — the compose change has to be applied from
  # a HOST shell, never `docker compose up` from inside the devcontainer.
  #
  # mic: >-
  #   exec:ffmpeg -re -f pulse -i default -c:a libopus -b:a 48k
  #   -rtsp_transport tcp -f rtsp {output}

webrtc:
  candidates:
    # The compose file publishes container 8555 as HOST 28555 on 127.0.0.1 —
    # this candidate is what makes WebRTC work for a browser on this machine
    # (go2rtc would otherwise advertise its unreachable container IP), and it
    # must name the HOST port the browser can dial. To view from another
    # device, open the port binding in compose.yaml and add "LAN-IP:28555".
    - 127.0.0.1:28555

# E8 (root README): "*" or no browser video — see go2rtc.example.yaml.
api:
  origin: "*"
