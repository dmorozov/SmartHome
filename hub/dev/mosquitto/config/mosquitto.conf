# Mosquitto broker for the DEVELOPMENT Hub stack (hub/dev).
# Serves ring-mqtt, Home Assistant's MQTT integration, and any future MQTT
# devices being brought up on the workstation.

# Listen on 1883 on all container interfaces; docker compose publishes it to
# 127.0.0.1 only — nothing on the LAN can reach this broker.
listener 1883 0.0.0.0

# Anonymous access: acceptable HERE because the compose file binds the host
# port to localhost. The appliance broker (../../mosquitto/) is the one that
# must switch to authenticated access before production — see its config.
allow_anonymous true

# Retained messages and subscriptions survive broker restarts.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
