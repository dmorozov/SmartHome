# Development Hub — Home Assistant + the non-multicast device services, on
# the workstation.
#
# NOT the appliance stack. `../compose.yaml` is the real Hub (host
# networking, Zigbee2MQTT) and still belongs on the Linux appliance. This
# one started as HA-alone for developing the Panel's WebSocket `HubClient`;
# on 2026-08-03 it grew Mosquitto + ring-mqtt + go2rtc, because every
# integration that does NOT need mDNS/multicast can be built right here —
# including on an Apple-silicon Mac (all four images ship arm64 variants).
#
# What runs here:
#   - Home Assistant (same 2026.7 pin as the appliance stack)
#   - Mosquitto      — broker for ring-mqtt and future MQTT devices
#   - ring-mqtt      — Ring doorbell via Ring's cloud API -> MQTT discovery
#   - go2rtc         — restream layer for camera live view (Wyze RTSP, Ring)
#   Plus, needing no container at all: Kasa plugs/switches (HA's native
#   tplink integration, local protocol — add each device manually BY IP,
#   discovery broadcasts don't cross Docker bridge networking).
#
# What it still deliberately does NOT do:
#   - No host networking, so no mDNS/multicast, so no HomeKit-controller
#     pairing (Ecobee) and no Samsung TV discovery. Those need the Linux
#     appliance; see ../README.md.
#   - No Zigbee (no coordinator hardware yet; the SLZB-06 is Ethernet, so
#     Z2M over TCP would work here once it arrives).
#
# Host-published ports are bound to 127.0.0.1 where only this machine needs
# them (MQTT debugging, the two web UIs); containers talk to each other over
# the compose network by service name.
#
# HOST PORTS ARE SHIFTED, never canonical (learned the hard way 2026-08-05:
# the first devcontainer `up` died on "address already in use"). The interim
# Hub host (ADR-0008) and the dev workstation are the SAME laptop, so the
# PRODUCTION stack — ../compose.yaml on host networking — already owns every
# canonical port here: HA :8123, go2rtc :1984/:8554/:8555 (and :18554/:18555),
# Mosquitto :1883, ring-mqtt :55123/:8556. The container-side ports stay
# canonical (service-name URLs like http://homeassistant:8123 are unchanged);
# only the HOST side moves:
#
#     dev HA        localhost:18123   (8123  + 10000)
#     dev MQTT      localhost:11883   (1883  + 10000)
#     dev go2rtc    localhost:11984   (1984  + 10000)
#     dev ring-mqtt localhost:65123   (55123 + 10000)
#     dev RTSP      localhost:28554   (8554  + 20000 — production go2rtc
#     dev WebRTC    localhost:28555    also listens on :18554/:18555)
#
# On the host, canonical port = the real house; shifted port = this sandbox.
# That reading is the point: a browser tab on :8123 can never quietly be the
# dev Hub, and onboarding the dev Hub can never quietly hit production.
name: smarthome-dev-hub

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.7
    # Distinct from the appliance stack's `homeassistant`, so both can exist
    # on one machine without a name collision.
    container_name: homeassistant-dev
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Shifted (see header): production HA owns :8123 on this machine.
      - "18123:8123"
    volumes:
      - ./ha-config:/config
    restart: unless-stopped

  mosquitto:
    # Same image pin as the appliance stack.
    image: eclipse-mosquitto:2
    container_name: mosquitto-dev
    ports:
      # localhost-only: for mosquitto_sub/pub debugging from this machine.
      # ring-mqtt and HA reach the broker over the compose network instead.
      # Shifted (see header): production Mosquitto owns :1883.
      - "127.0.0.1:11883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped

  ring-mqtt:
    # Pinned exactly (5.9.3 was latest at first bring-up, 2026-08-03) — same
    # deliberate-updates-only policy as the HA image.
    # NOT a Home Assistant "Add-on": add-ons require HA OS/Supervised; on HA
    # Container this standalone image is the same project, configured by
    # ring-mqtt-data/config.json, discovered by HA through MQTT discovery.
    # (v5.x REQUIRES the config file — the MQTTHOST-style env vars are gone.)
    image: tsightler/ring-mqtt:5.9.3
    container_name: ring-mqtt-dev
    depends_on:
      - mosquitto
    environment:
      TZ: ${TZ:-UTC}
    ports:
      # Web UI for the Ring login/2FA -> refresh-token flow, and for reading
      # each camera's internal RTSP path. localhost-only.
      # Shifted (see header): production ring-mqtt owns :55123.
      - "127.0.0.1:65123:55123"
    volumes:
      # config.json (authored, no secrets — recreate from README.md if lost)
      # plus runtime state including the Ring REFRESH TOKEN. The whole
      # directory is gitignored because of that token.
      - ./ring-mqtt-data:/data
    restart: unless-stopped

  go2rtc:
    # Same image pin as the appliance stack (the version Frigate 0.17 embeds,
    # per docs/research/frigate-amd-acceleration.md).
    image: alexxit/go2rtc:1.9.10
    container_name: go2rtc-dev
    environment:
      # Talkback: the `mic` stream captures with `ffmpeg -f pulse -i default`,
      # which needs a PulseAudio server. Container-side path, NOT the host's
      # $XDG_RUNTIME_DIR — the bind mount below always lands at /run/user/1000
      # inside regardless of which host path it came from, so this is a
      # constant. (Same pair as ring-audio-test/compose.yaml, which is where
      # microphone capture through PipeWire was first proven, and as
      # .devcontainer/compose.yaml.)
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    ports:
      # API + web UI (stream preview via MSE works over this port alone).
      # Shifted (see header): production go2rtc owns :1984.
      - "127.0.0.1:11984:1984"
      # RTSP out, for checking streams with VLC/ffprobe from this machine.
      # +20000, not +10000: production go2rtc also listens on :18554/:18555.
      - "127.0.0.1:28554:8554"
      # WebRTC media. Bound to localhost like the rest — the Panel runs in a
      # browser on this machine; go2rtc.yaml lists 127.0.0.1:28555 as the
      # candidate (the HOST port a browser can actually dial, not the
      # container's 8555). To view from another device, publish these on the
      # LAN and add this machine's LAN IP as a candidate.
      - "127.0.0.1:28555:8555/tcp"
      - "127.0.0.1:28555:8555/udp"
    volumes:
      # Stream definitions (may embed camera credentials — gitignored; copy
      # go2rtc.example.yaml -> go2rtc.yaml first, see README.md).
      - ./go2rtc:/config
      # PipeWire's PulseAudio-compat socket, for the `mic` stream (talkback).
      # A direct /dev/snd pass-through is the wrong answer and was tried:
      # PipeWire already holds the device exclusively on any modern desktop,
      # so ffmpeg gets "Resource busy". Going THROUGH PipeWire is the fix.
      # World-rw, so no UID/group matching is needed inside the container.
      # ⚠️ Worth saying plainly: with this mounted and `mic` enabled, anything
      # that can reach go2rtc's API can open this machine's microphone. There
      # is no auth on that API — the network boundary is the control (root
      # README, E8), and every port here is bound to 127.0.0.1.
      # ⚠️ /run/user/1000 is the DEV OPERATOR's uid. On the Appliance the
      # kiosk account owns the audio session and this path is simply wrong —
      # that is open owner decision E9, and it belongs to hub/compose.yaml,
      # not here.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/user/1000/pulse
    restart: unless-stopped

  talk-watchdog:
    # Dead-man switch for Ring talkback. go2rtc has no idle timeout on internal
    # producers, so nothing reaps a wedged microphone — and a wedged microphone
    # holds the doorbell in live view, where #177014 says it can suppress a
    # real ding. (Not a battery cost: this doorbell is hardwired.)
    # Stop authority has to be here
    # rather than in the Panel, because the Panel is the thing that might crash
    # mid-press. See ../talk-watchdog/README.md.
    #
    # No image build: the code is stdlib-only, so a stock python image with the
    # directory mounted read-only is the whole deployment.
    image: python:3.12-slim
    container_name: talk-watchdog-dev
    depends_on:
      - go2rtc
    command: ["python3", "/app/watchdog.py"]
    environment:
      # Service name on the compose network, not a published host port.
      GO2RTC: http://go2rtc:1984
      TALK_STREAM: ring
      MIC_STREAM: mic
      TALK_CAP_S: "45"
    volumes:
      - ../talk-watchdog:/app:ro
    restart: unless-stopped
