# Home Assistant starter configuration for the Hub.
# The Hub is headless: its built-in frontend exists but is only used for
# administration; the Panel is the family-facing UI.

# Standard set of integrations (recorder, history, mobile_app, automation
# engine, etc.).
default_config:

# --- Panel authentication -----------------------------------------------------
# The Panel connects to the Hub over the WebSocket API at
#   ws://<appliance>:8123/api/websocket
# authenticating with a long-lived access token (valid 10 years).
# Tokens are NOT configured in this file — they are minted in the HA UI:
#   your user profile (bottom-left avatar) -> Security tab
#   -> "Long-lived access tokens" -> Create token.
# Paste the token into the Panel's own configuration; never commit it to git.
# ------------------------------------------------------------------------------

# Automations live in the Hub's native engine (the Panel is a pure
# view/command layer — see ADR-0002). This include keeps them editable from
# the HA automation UI.
automation: !include automations.yaml

# Scripts — the same story as automations: kept in a tracked include so the HA
# UI can edit them and `git diff` shows what changed. Adding this line needed
# an HA restart; edits to scripts.yaml afterwards only need the `script.reload`
# service (Developer Tools -> Actions).
script: !include scripts.yaml

# Manually-declared MQTT entities (the UI-configured MQTT integration
# handles discovery; this include adds entities discovery cannot mint —
# today: the doorbell's event entity, phase-7 §A). Live file gitignored,
# its topics embed this install's Ring ids. Fresh bring-up:
# cp mqtt.example.yaml mqtt.yaml FIRST (hub/README step 1) — this include
# makes the file load-bearing for HA startup.
mqtt: !include mqtt.yaml

# The web Panel (second-screen target) will fetch camera snapshots from
# HA's REST camera_proxy cross-origin, which needs
#   http:
#     cors_allowed_origins:
#       - "<the second-screen origin>"
# No such origin exists yet, so the block is deliberately absent — add it
# with the specific origin (never "*") when the second screen lands.
# Phase-7 §B4 is the reasoning.
