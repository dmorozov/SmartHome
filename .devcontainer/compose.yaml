# Devcontainer overlay on hub/dev/compose.yaml — the SAME development Hub
# stack described in hub/dev/README.md, with one more service: the
# workspace the editor attaches to. devcontainer.json lists both files, so
# opening the devcontainer brings up HA + Mosquitto + ring-mqtt + go2rtc as
# siblings on one compose network, and `http://homeassistant:8123` resolves
# from inside the workspace by service name.
#
# Three facts worth knowing before touching this:
#
#  - Relative paths in this file resolve against hub/dev/ — the FIRST file
#    in devcontainer.json's dockerComposeFile list sets the project
#    directory for every merged file. Hence `../..` for the repo root and
#    `../../.devcontainer` for the build context two entries down.
#
#  - The editor derives its compose --project-name from the merged config's
#    top-level `name:` — smarthome-dev-hub, from hub/dev/compose.yaml — so
#    this stack and a `docker compose up` run by hand in hub/dev/ are the
#    SAME compose project. Compose reconciles rather than collides on the
#    pinned container_names, which is exactly why drivers must change hands
#    explicitly: an `up` from either side silently adopts the other's
#    containers, and the editor stops the whole project on window close
#    (shutdownAction). initialize.sh refuses to take over a hand-started
#    stack for that reason. Nothing is lost by switching drivers: all state
#    lives in bind mounts under hub/dev/ (the HA account, the token, the
#    Ring refresh token).
#
#  - Docker runs on the HOST (the docker-outside-of-docker feature mounts
#    the socket), so bind paths resolve against the HOST checkout when the
#    editor runs `up`. From INSIDE the workspace those same relative paths
#    would resolve against /workspaces/SmartHome — a path the daemon does
#    not have — so never run `docker compose up/down` from an in-container
#    terminal. Restarting a service is safe by container name:
#    `docker restart go2rtc-dev`.
services:
  workspace:
    build:
      # Relative to hub/dev/ (see the header), NOT to this file.
      context: ../../.devcontainer
      dockerfile: Dockerfile
    volumes:
      # The repo, at the canonical devcontainer path (devcontainer.json's
      # workspaceFolder). :cached is a macOS bind-mount hint, inert on Linux.
      - ../..:/workspaces/SmartHome:cached
      # pub packages survive container rebuilds; the mountpoint is
      # pre-created vscode-owned in the Dockerfile so the volume inherits
      # that ownership on first use.
      - pub-cache:/home/vscode/.pub-cache
      # Same pattern, same reason, for the agent's browser: ~170 MB of
      # Chromium that post-create.sh would otherwise re-download on every
      # rebuild. Mountpoint pre-created vscode-owned in the Dockerfile.
      - playwright-cache:/home/vscode/.cache/ms-playwright
      # The HOST's PipeWire, via its PulseAudio-compat socket. The workspace
      # runs no audio server of its own — it borrows the host operator's
      # session, exactly as hub/dev/ring-audio-test/compose.yaml already does
      # for go2rtc. Needed to hear the doorbell (ADR-0011) and to verify the
      # GStreamer inbound pipeline on Ubuntu 24.04 before Ansible copies it.
      #
      # Source resolves on the HOST (docker-outside-of-docker), so it is the
      # host operator's $XDG_RUNTIME_DIR; the in-container path is fixed at
      # /run/user/1000 regardless of either side's UID, which is why
      # PULSE_SERVER below can be a constant. Absolute on purpose — unlike
      # every other path here it must NOT resolve against hub/dev/.
      #
      # If the host has no PipeWire/Pulse socket the bind source does not
      # exist and dockerd silently creates an empty directory (the ADR-0010
      # ${HOME} trap): audio then fails at connect time, not at start time.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/user/1000/pulse
      # PipeWire's NATIVE socket, additionally, so pw-play/pw-record work as
      # diagnostics. The pipeline that matters (gst pulsesink, go2rtc's
      # `-f pulse`) needs only the pulse socket above — but pw-play speaks the
      # native protocol and fails with "pw_context_connect() failed: Host is
      # down" without this. Verified 2026-08-08: pw-play exits 0 with it.
      #
      # This binds a single SOCKET FILE, not a directory: if the host's
      # PipeWire restarts it unlinks and recreates the socket, and the
      # container keeps the stale inode until it is recreated too. Diagnostics
      # break, audio does not — pulsesink keeps working through the directory
      # mount above. Worth knowing before debugging a "pw-play broke" report.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pipewire-0:/run/user/1000/pipewire-0
    environment:
      TZ: ${TZ:-UTC}
      # Container-side path, not the host's — see the mount note above.
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      # Points libpipewire at the native socket. Deliberately NOT
      # XDG_RUNTIME_DIR: that is a broader contract other tools consume, and
      # /run/user/1000 here holds only these two audio sockets.
      PIPEWIRE_RUNTIME_DIR: /run/user/1000
    # Compose-based devcontainers do not override the command: the service
    # has to keep itself alive for the editor to attach to.
    command: sleep infinity

volumes:
  pub-cache:
  playwright-cache:
